aceholder="Поиск: BMW, клипса, органайзер, корпус..." autocomplete="off"><a class="btn primary" href="index.html#order">Предложить свою модель</a></div><div id="category-tabs" class="category-tabs"></div><div id="catalog-count" class="catalog-count"></div><div id="catalog-grid" class="catalog-grid-full"></div><div class="show-more-wrap"><button id="show-more" class="show-more">Показать ещё</button></div></main><footer id="contacts"><img src="assets/logo-horizontal.png" alt="3D-PRINT"><p>3D-печать · Фотополимер · ЧПУ</p><a href="index.html#order">Оставить заявку →</a><small>© 2026 3D-PRINT</small></footer><script src="catalog-data.js"></script><script src="catalog-page.js"></script><script src="background-effect.js"></script></body></html>
