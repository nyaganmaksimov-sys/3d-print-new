name: Generate PNG artwork

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Convert SVG artwork to PNG
        run: |
          mkdir -p assets
          shopt -s nullglob
          for f in assets/*.svg; do
            name=$(basename "$f" .svg)
            convert -background '#050608' -density 120 "$f" -resize 1200x700 "assets/$name.png"
          done

      - name: Add interactive mouse background
        run: python3 scripts/add_interactive_background.py

      - name: Make service images smaller with edge spacing
        run: python3 scripts/shrink_service_images.py

      - name: Install 3D-ARTPRINT favicon
        run: |
          # favicon.ico is already stored in the repository.
          # The old favicon32.b64 mechanism was removed because the file
          # is no longer part of the repository and caused the commit step to fail.
          test -f favicon.ico

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.png index.html favicon.ico
          # Stage deletions/changes without naming files that may not exist.
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "Generate artwork and keep favicon"
          git push
