name: Generate PNG artwork

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Convert SVG artwork to PNG
        run: |
          mkdir -p assets
          shopt -s nullglob
          for f in assets/*.svg; do
            name=$(basename "$f" .svg)
            convert -background '#050608' -density 120 "$f" -resize 1200x700 "assets/$name.png"
          done

      - name: Add interactive mouse background
        run: python3 scripts/add_interactive_background.py

      - name: Make service images smaller with edge spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = r'''\n/* Service image sizing: compact with visible breathing room */\n.modal-card img, .service-modal img, .service-detail img, .service-detail-media img {\n  display:block;\n  width:min(72%, 520px);\n  max-width:520px;\n  height:auto;\n  max-height:420px;\n  object-fit:contain;\n  margin:0 auto 28px;\n  padding:14px;\n  border-radius:16px;\n  background:rgba(255,255,255,.035);\n  border:1px solid rgba(255,255,255,.10);\n  box-shadow:0 18px 50px rgba(0,0,0,.35);\n}\n@media (max-width:760px){\n  .modal-card img, .service-modal img, .service-detail img, .service-detail-media img {\n    width:86%;\n    max-width:420px;\n    max-height:300px;\n    margin-bottom:20px;\n    padding:10px;\n  }\n}\n'''
          if 'Service image sizing: compact with visible breathing room' not in s:
              if marker not in s:
                  raise SystemExit('style marker not found')
              s = s.replace(marker, css + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.png index.html
          git diff --cached --quiet && exit 0
          git commit -m "Adjust service image size and spacing"
          git push
