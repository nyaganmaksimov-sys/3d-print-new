name: Inject theme switch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add theme script to main page
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'theme.js?v=20260828-1'
          if marker not in text:
              needle = '<script src="service-modal.js?v=20260828-4"></script>'
              replacement = needle + '\n<script src="theme.js?v=20260828-1"></script>'
              if needle not in text:
                  raise SystemExit('service-modal script marker not found in index.html')
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Commit theme injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Theme script already injected"
            exit 0
          fi
          git commit -m "Add dark and light theme switch to main page"
          git push
