name: Inject theme and calculator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add theme and calculator scripts to main page
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'theme.js?v=20260828-1' not in text:
              needle = '<script src="service-modal.js?v=20260828-4"></script>'
              replacement = needle + '\n<script src="theme.js?v=20260828-1"></script>'
              if needle not in text:
                  raise SystemExit('service-modal script marker not found in index.html')
              text = text.replace(needle, replacement, 1)

          if 'calculator-pro.js?v=20260829-1' not in text:
              needle = '<script src="theme.js?v=20260828-1"></script>'
              replacement = needle + '\n<script src="calculator-pro.js?v=20260829-1"></script>'
              if needle not in text:
                  raise SystemExit('theme script marker not found in index.html')
              text = text.replace(needle, replacement, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Scripts already injected"
            exit 0
          fi
          git commit -m "Enable advanced production calculator"
          git push
