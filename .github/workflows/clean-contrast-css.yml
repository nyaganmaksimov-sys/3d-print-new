name: Clean contrast CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean injected CSS formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* 3D-ARTPRINT contrast pass */'
          if marker not in s:
              raise SystemExit('contrast marker not found')
          before, rest = s.split(marker, 1)
          rest = rest.replace('\\\\n', '\n')
          s = before + marker + rest
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit clean CSS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix contrast CSS formatting'
          git push
