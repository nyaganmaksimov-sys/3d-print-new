name: Install favicon

on:
  push:
    branches: [main]
    paths:
      - 'favicon32.b64'
      - 'favicon-new.txt'

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install generated favicon
        run: |
          base64 -d favicon32.b64 > favicon.ico
          rm -f favicon32.b64 favicon-new.txt

      - name: Commit favicon
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favicon.ico
          git add -u favicon32.b64 favicon-new.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Install new 3D-ARTPRINT favicon'
          git push
