name: Add interactive background

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add interactive background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="interactive-bg"' in s:
              print('Interactive background already installed')
              raise SystemExit(0)
          css = '''\n#interactive-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;opacity:.95}.interactive-hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2;pointer-events:none;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.22);text-transform:uppercase;transition:opacity .6s}.interactive-hint.hide{opacity:0}\nheader,main,footer{position:relative;z-index:1}\n@media(max-width:760px){.interactive-hint{display:none}}\n@media(prefers-reduced-motion:reduce){#interactive-bg{display:none}}\n'''
          s = s.replace('</style>', css + '</style>', 1)
          s = s.replace('<body>', '<body>\n<canvas id="interactive-bg" aria-hidden="true"></canvas><div class="interactive-hint" id="interactiveHint">двигайте мышкой по фону</div>', 1)
          js = r'''\n/* 3D-ARTPRINT — интерактивные неоновые фигуры */
(function(){
const canvas=document.getElementById('interactive-bg'),ctx=canvas&&canvas.getContext('2d'),hint=document.getElementById('interactiveHint');
if(!canvas||!ctx)return;
let dpr=1,w=0,h=0,last=0,mouse={x:-9999,y:-9999,active:false},figures=[],sparks=[];
const colors=['#00bfff','#ff087d','#ffd400','#a45cff','#ff8a00'];
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce)return;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function rand(a,b){return a+Math.random()*(b-a)}
function addFigure(x,y){const type=['cube','diamond','gear','triangle','ring'][Math.floor(Math.random()*5)],size=rand(18,48),life=rand(900,1700);figures.push({x:x+rand(-45,45),y:y+rand(-45,45),type,size,life,born:performance.now(),rot:rand(0,Math.PI*2),speed:rand(-.018,.018),vx:rand(-.16,.16),vy:rand(-.32,-.08),color:colors[Math.floor(Math.random()*colors.length)]});if(figures.length>34)figures.splice(0,figures.length-34);for(let i=0;i<5;i++)sparks.push({x:x+rand(-15,15),y:y+rand(-15,15),vx:rand(-1.2,1.2),vy:rand(-1.2,1.2),life:rand(300,650),born:performance.now(),color:colors[Math.floor(Math.random()*colors.length)]})}
function line(x1,y1,x2,y2,color,a=1){ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function draw(f,a){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.globalAlpha=a;ctx.strokeStyle=f.color;ctx.shadowColor=f.color;ctx.shadowBlur=10;ctx.lineWidth=1.4;const s=f.size;
if(f.type==='cube'){const q=s*.58;line(-q,-q,q*.05,-q,f.color);line(q*.05,-q,q,-q*.35,f.color);line(q,-q*.35,q,q*.55,f.color);line(q,q*.55,q*.05,q,f.color);line(q*.05,q,-q,q,f.color);line(-q,q,-q,-q,f.color);line(-q*.05,-q*.45,q*.05,-q,f.color);line(-q*.05,-q*.45,-q,0,f.color);line(-q*.05,-q*.45,q,q*.55,f.color)}
else if(f.type==='diamond'){ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.65,0);ctx.lineTo(0,s);ctx.lineTo(-s*.65,0);ctx.closePath();ctx.stroke();line(0,-s,0,s,f.color,.55);line(-s*.65,0,s*.65,0,f.color,.55)}
else if(f.type==='triangle'){ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.9,s*.65);ctx.lineTo(-s*.9,s*.65);ctx.closePath();ctx.stroke();line(0,-s,0,s*.65,f.color,.55)}
else if(f.type==='ring'){ctx.beginPath();ctx.arc(0,0,s*.65,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*.25,0,Math.PI*2);ctx.stroke();for(let i=0;i<8;i++){const a=i*Math.PI/4;line(Math.cos(a)*s*.65,Math.sin(a)*s*.65,Math.cos(a)*s*.9,Math.sin(a)*s*.9,f.color,.7)}}
else{const teeth=10;ctx.beginPath();for(let i=0;i<teeth*2;i++){const a=i*Math.PI/teeth,r=i%2?s*.7:s*.9,x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*.34,0,Math.PI*2);ctx.stroke()}
ctx.restore()}
function tick(now){ctx.clearRect(0,0,w,h);if(mouse.active){const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,190);g.addColorStop(0,'rgba(0,191,255,.07)');g.addColorStop(.4,'rgba(164,92,255,.035)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(mouse.x-190,mouse.y-190,380,380)}
figures=figures.filter(f=>now-f.born<f.life);for(const f of figures){const p=(now-f.born)/f.life;f.x+=f.vx;f.y+=f.vy;f.rot+=f.speed;draw(f,Math.sin(Math.min(p,1)*Math.PI)*.75)}
sparks=sparks.filter(s=>now-s.born<s.life);for(const q of sparks){const p=(now-q.born)/q.life;q.x+=q.vx;q.y+=q.vy;q.vy+=.012;ctx.globalAlpha=(1-p)*.8;ctx.fillStyle=q.color;ctx.shadowColor=q.color;ctx.shadowBlur=7;ctx.beginPath();ctx.arc(q.x,q.y,1.6,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(tick)}
function move(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;if(hint)hint.classList.add('hide');const now=performance.now();if(now-last>85){addFigure(mouse.x,mouse.y);addFigure(mouse.x,mouse.y);last=now}}
addEventListener('resize',resize);addEventListener('pointermove',move,{passive:true});addEventListener('pointerleave',()=>mouse.active=false);resize();requestAnimationFrame(tick);
})();
'''
          s = s.replace('</script>', js + '</script>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add interactive neon 3D background'
          git push
