name: Improve dark UI contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve contrast of dark panels and fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* 3D-ARTPRINT contrast pass */'
          if marker in s:
              print('Contrast pass already installed')
              raise SystemExit(0)
          css = r'''\n/* 3D-ARTPRINT contrast pass */\n.calc-box{background:linear-gradient(135deg,rgba(15,25,36,.98),rgba(10,14,21,.98));border:1px solid rgba(0,191,255,.34);box-shadow:0 18px 55px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.055)}\n.calc-form{background:rgba(255,255,255,.018);padding:18px;border:1px solid rgba(255,255,255,.07);border-radius:10px}\n.field label{color:#d4d9e0;font-size:11px;letter-spacing:.25px}.field input,.field select{background:#111923;border:1px solid rgba(255,255,255,.20);box-shadow:inset 0 1px 3px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.12);color:#fff}.field input::placeholder{color:#778392}.field input:hover,.field select:hover{border-color:rgba(0,191,255,.42)}.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,191,255,.12),inset 0 1px 3px rgba(0,0,0,.45)}\n.calc-result{border:1px solid rgba(0,191,255,.42);background:linear-gradient(145deg,#111c28,#0b1018);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 35px rgba(0,0,0,.3)}.calc-label{color:#b9c2cd}.calc-note{color:#aab3be}\n.service,.model-card,.step,.order-box{border-color:rgba(255,255,255,.18);box-shadow:0 12px 35px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035)}.service{background:linear-gradient(180deg,#111722,#0b0e14)}.model-card{background:linear-gradient(180deg,#10151d,#0b0e13)}.step{background:linear-gradient(180deg,#10151c,#0b0e13)}.order-box{background:linear-gradient(135deg,#101722,#0b0f15)}\n.service-link{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.025)}.service-link:hover{border-color:rgba(0,191,255,.55);background:rgba(0,191,255,.06)}\n.modal-card{background:linear-gradient(145deg,#111722,#0b0f15);border-color:rgba(255,255,255,.24);box-shadow:0 30px 100px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.06)}.modal-close{border-color:rgba(255,255,255,.24);background:#151b24}.modal-card p{color:#b9c1cb}.modal-card ul{color:#d4d9df}\ntextarea,form input{background:#111923;border-color:rgba(255,255,255,.20);box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}textarea::placeholder,form input::placeholder{color:#778392}textarea:focus,form input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,191,255,.12),inset 0 1px 3px rgba(0,0,0,.45)}\n.order-btn{box-shadow:0 8px 25px rgba(255,255,255,.08)}\n@media(max-width:760px){.calc-form{padding:14px}.calc-box{border-color:rgba(0,191,255,.38)}}\n'''
          s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Improve contrast across dark UI panels'
          git push
